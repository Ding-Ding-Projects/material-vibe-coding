name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build installer
        run: npx electron-forge make --platform win32 --arch x64
      - name: Collect artifacts
        if: always()
        shell: pwsh
        run: |
          New-Item -Path staging -ItemType Directory -Force | Out-Null
          Get-ChildItem -Path "out/make/squirrel.windows" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "staging/$($_.Name)"
          }
          Get-ChildItem -Path "out/make/zip" -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "staging/$($_.Name)"
          }
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-vibe-coding-${{ github.sha }}
          path: staging/
          retention-days: 7
